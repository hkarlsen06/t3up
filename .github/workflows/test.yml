name: test
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y dash
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows:
    # Windows can't run the pty or dash tests: check that t3up starts and a failing host reports cleanly.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - shell: bash
        run: |
          printf 'nobody@127.0.0.1\n' > servers
          export T3UP_SERVERS_FILE=servers
          ./target/debug/t3up --list | grep -qx 'nobody@127.0.0.1'
          set +e; ./target/debug/t3up --check > out.txt; code=$?; set -e
          cat out.txt
          test "$code" = 1
          grep -q '0/1 passed' out.txt
