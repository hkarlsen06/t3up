name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get install -y musl-tools
        if: runner.os == 'Linux'
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/t3up
          [ -f "$bin.exe" ] && bin=$bin.exe
          name=t3up-${{ matrix.target }}
          mkdir "$name" && cp "$bin" README.md LICENSE "$name/"
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$name.zip" "$name" >/dev/null; archive=$name.zip
          else tar czf "$name.tar.gz" "$name"; archive=$name.tar.gz; fi
          # The SHA-256 that t3up --self-update checks the download against.
          if command -v sha256sum >/dev/null; then sha256sum "$archive"; else shasum -a 256 "$archive"; fi | awk '{ print $1 }' > "$archive.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            t3up-*.tar.gz
            t3up-*.zip
            t3up-*.sha256
